
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phone OTP Verification</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 85%;
      max-width: 360px;
      box-shadow: 0 4px 20px #0001;
    }

    h2 {
      text-align: center;
      color: #333;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin: 12px 0;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #5046e5;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 16px;
      margin-top: 10px;
    }

    button:disabled {
      opacity: 0.6;
    }

    #otp-section {
      display: none;
    }

    #message {
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Phone Verification</h2>

    <div id="phone-section">
      <input
        id="phone"
        type="tel"
        placeholder="+923001234567"
      />

      <div id="recaptcha-container"></div>

      <button id="send-otp">
        Send OTP
      </button>
    </div>

    <div id="otp-section">
      <p>Enter your 6-digit verification code.</p>

      <input
        id="otp"
        type="text"
        inputmode="numeric"
        maxlength="6"
        placeholder="Enter OTP"
      />

      <button id="verify-otp">
        Verify OTP
      </button>
    </div>

    <p id="message"></p>
  </div>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";

    import {
      getAuth,
      signInWithPhoneNumber,
      RecaptchaVerifier
    } from
      "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAGZGBS9LdeAM6xRIUCw1vyupvD85HUxcI",
      authDomain: "http://otp-verification-app-71b24.firebaseapp.com/",
      projectId: "otp-verification-app-71b24",
      storageBucket: "http://otp-verification-app-71b24.firebasestorage.app/",
      messagingSenderId: "505978632506",
      appId: "1:505978632506:web:554a5bb70566e1c0953803"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Development only: disables real app verification.
    // Use only with Firebase fictional test numbers.
    auth.settings.appVerificationDisabledForTesting = true;

    let confirmationResult = null;
    let verifier = null;

    const sendButton = document.getElementById("send-otp");
    const verifyButton = document.getElementById("verify-otp");
    const message = document.getElementById("message");

    sendButton.addEventListener("click", async () => {
      const phone = document.getElementById("phone").value.trim();

      if (!/^\+[1-9]\d{7,14}$/.test(phone)) {
        message.textContent =
          "Enter a valid number with country code.";
        message.style.color = "red";
        return;
      }

      sendButton.disabled = true;
      message.textContent = "Requesting verification...";

      try {
        verifier = new RecaptchaVerifier(
          auth,
          "send-otp",
          { size: "invisible" }
        );

        confirmationResult = await signInWithPhoneNumber(
          auth,
          phone,
          verifier
        );

        document.getElementById("phone-section").style.display = "none";
        document.getElementById("otp-section").style.display = "block";

        message.textContent =
          "Verification code requested successfully. Use your configured test code.";
        message.style.color = "green";

      } catch (error) {
        message.textContent = error.message;
        message.style.color = "red";

        if (verifier) {
          verifier.clear();
          verifier = null;
        }
      } finally {
        sendButton.disabled = false;
      }
    });

    verifyButton.addEventListener("click", async () => {
      const code = document.getElementById("otp").value.trim();

      if (!/^\d{6}$/.test(code)) {
        message.textContent = "Enter a valid 6-digit OTP.";
        message.style.color = "red";
        return;
      }

      verifyButton.disabled = true;

      try {
        const result = await confirmationResult.confirm(code);

        message.textContent =
          "Phone number verified successfully!";
        message.style.color = "green";

        document.getElementById("otp-section").style.display = "none";

        console.log("Verified user:", result.user.uid);

      } catch (error) {
        message.textContent =
          "Verification failed. Incorrect OTP.";
        message.style.color = "red";
      } finally {
        verifyButton.disabled = false;
      }
    });
  </script>
</body>
</html>
